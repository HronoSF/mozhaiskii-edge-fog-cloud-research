<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="630" viewBox="0 0 1680 630" role="img" aria-label="A single Linux VM with Docker: a gateway scheduler with source FIFO and three sender queues sends jobs to Edge and Fog over the access network and to Cloud via Fog on a WAN.">
<rect width="1680" height="630" fill="white"/>
<text x="50" y="62" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="#17283D">One orchestrator, three different workers</text>
<text x="50" y="97" font-family="Arial,sans-serif" font-size="20" fill="#50647A">All four Docker containers run in the same Linux VM · MADT emulates their network connections</text>
<rect x="24" y="120" width="1632" height="458" rx="18" fill="#F6F8FC" stroke="#C9D5E0" stroke-width="2"/>
<rect x="52" y="162" width="438" height="355" rx="18" fill="#E7EFF7" stroke="#7E9CB6" stroke-width="2.5"/>
<text x="271" y="201" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" font-weight="bold" fill="#17283D">Gateway / Orchestrator (G)</text>
<text x="271" y="231" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#50647A">0.50 CPU · 256 MiB RAM</text>
<rect x="100" y="253" width="342" height="52" rx="9" fill="white" stroke="#9CAEC0"/>
<text x="271" y="287" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#17283D">Incoming task queue (FIFO)</text>
<path d="M271 305 V333" stroke="#44647E" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="100" y="338" width="342" height="62" rx="9" fill="white" stroke="#9CAEC0"/>
<text x="271" y="364" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#17283D">Choose a worker</text>
<text x="271" y="389" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#50647A">RR / Compute-ECT / Network-ECT</text>
<path d="M271 400 V426" stroke="#44647E" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="100" y="431" width="342" height="58" rx="9" fill="#F9FCFF" stroke="#9CAEC0"/>
<text x="271" y="454" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#17283D">Three outgoing task queues</text>
<text x="271" y="480" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#50647A">Sender E     ·     Sender F     ·     Sender C</text>
<rect x="650" y="164" width="373" height="166" rx="18" fill="white" stroke="#1B7C89" stroke-width="3"/>
<rect x="650" y="164" width="373" height="11" rx="4" fill="#1B7C89"/>
<text x="836" y="212" font-family="Arial,sans-serif" font-size="29" font-weight="bold" text-anchor="middle" fill="#1B7C89">Edge (E)</text>
<text x="836" y="247" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#50647A">0.25 CPU · 256 MiB RAM</text>
<text x="836" y="281" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#17283D">Local FIFO → 1 CPU slot</text>
<rect x="650" y="379" width="373" height="166" rx="18" fill="white" stroke="#B17B35" stroke-width="3"/>
<rect x="650" y="379" width="373" height="11" rx="4" fill="#B17B35"/>
<text x="836" y="427" font-family="Arial,sans-serif" font-size="29" font-weight="bold" text-anchor="middle" fill="#B17B35">Fog (F)</text>
<text x="836" y="461" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#50647A">0.50 CPU · 256 MiB RAM</text>
<text x="836" y="496" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#17283D">Local FIFO → 1 CPU slot</text>
<text x="836" y="522" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#50647A">Also forwards cloud traffic</text>
<rect x="1242" y="379" width="372" height="166" rx="18" fill="white" stroke="#6B5A9F" stroke-width="3"/>
<rect x="1242" y="379" width="372" height="11" rx="4" fill="#6B5A9F"/>
<text x="1428" y="427" font-family="Arial,sans-serif" font-size="29" font-weight="bold" text-anchor="middle" fill="#6B5A9F">Cloud (C)</text>
<text x="1428" y="461" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#50647A">1.00 CPU · 256 MiB RAM</text>
<text x="1428" y="496" font-family="Arial,sans-serif" font-size="21" text-anchor="middle" fill="#17283D">Local FIFO → 1 CPU slot</text>
<path d="M490 290 H570 V245 H650" fill="none" stroke="#1B7C89" stroke-width="5" marker-end="url(#arrowSea)"/>
<text x="570" y="211" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#1B7C89">Access</text>
<path d="M490 467 H650" fill="none" stroke="#B17B35" stroke-width="5" marker-end="url(#arrowFog)"/>
<text x="565" y="444" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#B17B35">Access</text>
<path d="M1023 462 H1242" fill="none" stroke="#6B5A9F" stroke-width="5" marker-end="url(#arrowCloud)"/>
<text x="1132" y="435" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#6B5A9F">WAN</text>
<text x="1132" y="490" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#6B5A9F">+20 ms*</text>
<text x="842" y="596" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#50647A">* In the delay scenario, a nominal 20 ms delay is applied to the ingress direction toward Cloud only.</text>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#44647E"/></marker><marker id="arrowSea" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#1B7C89"/></marker><marker id="arrowFog" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#B17B35"/></marker><marker id="arrowCloud" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#6B5A9F"/></marker></defs>
</svg>