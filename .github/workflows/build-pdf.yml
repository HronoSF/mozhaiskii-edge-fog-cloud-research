name: Build academic PDF

on:
  push:
    branches: [main]
    paths:
      - "report/scheduling-pilot.md"
      - "latex/**"
      - "data/**"
      - "figures/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install LaTeX build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            make pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            python3 python3-cairosvg poppler-utils
      - name: Compile from versioned sources
        run: |
          make
          test -s scheduling-pilot.pdf
          pdfinfo scheduling-pilot.pdf | grep -E "Pages:|Page size:|File size:"
          pdffonts scheduling-pilot.pdf | grep -q "LMRoman"
      - name: Save generated PDF to public repository
        run: |
          mkdir -p report
          cp scheduling-pilot.pdf report/scheduling-pilot.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/scheduling-pilot.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish XeLaTeX-built scheduling pilot PDF [skip ci]"
            git push
          fi
      - name: Preserve downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: scheduling-pilot-pdf
          path: scheduling-pilot.pdf
          if-no-files-found: error
